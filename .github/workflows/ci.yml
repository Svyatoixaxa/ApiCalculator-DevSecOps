name: Calculator CI Security

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Test, build and scan image (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install and test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
      - name: Build Docker image
        run: |
          docker build --pull --build-arg APP_VERSION="$APP_VERSION" -t "calculator-api:$APP_VERSION" .
      - name: Run and check container
        run: |
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/version | python -c 'import json, os, sys; data = json.load(sys.stdin); assert data["version"] == os.environ["APP_VERSION"], data; print(data)'
          trap 'docker logs calculator-test; docker rm -f calculator-test' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/version | python -c 'import json, os, sys; data = json.load(sys.stdin); assert data["version"] == os.environ["APP_VERSION"], data; print(data)'
          curl --fail --silent --show-error 'http://127.0.0.1:8000/add?a=2&b=3' | python -c 'import json, sys; data = json.load(sys.stdin); assert data == {"result": 5}, data; print(data)'
          test "$(docker exec calculator-test id -u)" = 10001
      - name: Save versioned image
        run: docker save -o calculator-api.tar "calculator-api:$APP_VERSION"
      - name: Run Trivy (report mode)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/work" ghcr.io/aquasecurity/trivy:0.76.2 image --input /work/calculator-api.tar --scanners vuln --severity HIGH,CRITICAL --format json --output /work/reports/trivy.json --exit-code 0
          docker run --rm -v "$PWD:/work:ro" ghcr.io/aquasecurity/trivy:0.76.2 convert --format table /work/reports/trivy.json
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-${{ github.run_number }}-${{ github.run_attempt }}
          path: reports/trivy.json
          if-no-files-found: warn
      - name: Upload versioned Docker image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calculator-api-${{ github.run_number }}-${{ github.run_attempt }}
          path: calculator-api.tar
          retention-days: 14

  semgrep:
    name: Semgrep source scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Semgrep (report mode)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.186.0 semgrep scan --config p/default --metrics off --json-output reports/semgrep.json
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-${{ github.run_number }}-${{ github.run_attempt }}
          path: reports/semgrep.json
          if-no-files-found: warn
